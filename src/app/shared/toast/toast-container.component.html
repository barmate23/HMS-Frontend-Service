<div class="toast-container" *ngIf="toastService.toasts().length > 0">
  <div *ngFor="let toast of toastService.toasts()" 
       class="toast-item toast-{{ toast.type }}"
       role="alert">
    
    <div class="toast-icon-frame">
      <span class="material-icons-round">{{ getIcon(toast.type) }}</span>
    </div>

    <div class="toast-content">
      <strong class="toast-title">{{ toast.title }}</strong>
      <p class="toast-message">{{ toast.message }}</p>
    </div>

    <button class="toast-close-btn" (click)="dismiss(toast.id)" title="Close notification">
      <span class="material-icons-round">close</span>
    </button>
  </div>
</div>
